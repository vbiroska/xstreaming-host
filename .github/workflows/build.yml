name: "Build XStreaming + Ryzen (etapa 4: loja Xbox + obter)"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Este repositório guarda: este arquivo + os 5 zips (etapa1, etapa2b, etapa3, etapa4 e o Ryzen)
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Geocld/XStreaming
          ref: 7fc4e41b5c3e6d08f4bb032820d461c6699e6adc
          path: xs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descompactar os zips
        run: |
          unzip -q -o ryzen_engine_etapa1.zip -d xs
          unzip -q -o ryzen_etapa2b.zip -d etapa2
          unzip -q -o ryzen_etapa3.zip -d etapa3
          unzip -q -o ryzen_etapa4.zip -d etapa4
          unzip -q -o ryzen_flutter_browser_fix.zip -d ryzen
          ls ryzen/ryzen_app | head

      # ---------- Ryzen vira biblioteca (AAR) ----------
      - name: Ryzen como módulo Flutter
        working-directory: ryzen/ryzen_app
        run: |
          python3 "$GITHUB_WORKSPACE/etapa2/apply_ryzen_dart.py"
          python3 "$GITHUB_WORKSPACE/etapa3/apply_native_dart.py"
          python3 "$GITHUB_WORKSPACE/etapa4/apply_store_dart.py"
          flutter pub get

      - name: Compilar o AAR do Ryzen
        working-directory: ryzen/ryzen_app
        run: flutter build aar --no-debug --no-profile --target-platform android-arm64 --build-number=1.0

      # ---------- XStreaming + motor + Ryzen ----------
      - name: Aplicar etapas 1 e 2 no XStreaming
        working-directory: xs
        run: |
          python3 ryzen_engine/apply_ryzen_engine.py
          RYZEN_APP="$GITHUB_WORKSPACE/ryzen/ryzen_app" \
          RYZEN_REPO="$GITHUB_WORKSPACE/ryzen/ryzen_app/build/host/outputs/repo" \
          python3 "$GITHUB_WORKSPACE/etapa2/apply_ryzen_host.py"
          python3 "$GITHUB_WORKSPACE/etapa3/apply_native_host.py"

      - name: Yarn
        working-directory: xs
        run: |
          corepack enable
          yarn install --no-immutable --mode=skip-build

      - name: Patches do XStreaming
        working-directory: xs
        run: |
          rm -f patches/react-native-paper+5.12.5.patch
          yarn patch-package

      - name: Rust (alvos Android)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: NDK 23 e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            yes | "$SDKM" --install "ndk;23.1.7779620" "cmake;3.22.1" && break
            sleep 10
          done

      - name: Chave de assinatura de teste
        working-directory: xs/android/app
        run: |
          keytool -genkey -v -keystore xstreaming-release-key.keystore -storepass 920712 \
            -alias xstreaming-key -keypass 920712 -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Ryzen Test,O=Ryzen,C=BR"

      - name: Compilar (release, JS embutido)
        working-directory: xs/android
        run: ./gradlew assembleDevRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ryzen-xstreaming-apk
          path: xs/android/app/build/outputs/apk/dev/release/*.apk
